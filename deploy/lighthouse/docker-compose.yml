# Lung3D 后端 · 轻量应用服务器（境内 2核2G）编排
# 使用：cd /opt/lung3d && docker compose up -d
services:
  lung3d:
    image: ${LUNG3D_IMAGE:-lung3d-web:latest}
    container_name: lung3d-web
    restart: unless-stopped

    # 只监听本机回环，由 nginx 对外提供 443；不直接把 8000 暴露到公网
    ports:
      - "127.0.0.1:8000:8000"

    environment:
      # ---- 2核2G 专项调优 ----
      # 网格降采样系数：越大越省内存/耗时（质量略降）。2核2G 建议 3，紧张时调 4
      MESH_DS_FACTOR: "3"
      # 气道壁单独再降一档
      WALL_DS_FACTOR: "4"
      # 串行处理，防并发 OOM
      MAX_CONCURRENT_PROCESSING: "1"
      # 远端细血管剪除阈值(mm)：越大网格越小
      DISTAL_PRUNE_MM: "1.0"
      # 本地盘无临时盘顾虑，放宽自动清理周期(天)
      CASE_EXPIRE_DAYS: "30"
      # ---- 微信小程序码（从 .env 注入，勿写死）----
      WX_APPID: "${WX_APPID}"
      WX_SECRET: "${WX_SECRET}"
      TZ: "Asia/Shanghai"

    volumes:
      # 病例数据落宿主机本地盘 → 容器重建/升级都不丢
      - /data/lung3d/cases:/app/web_output/cases

    # 内存硬上限，避免单个病例把宿主机拖死（swap 由 setup_server.sh 配置）
    mem_limit: 1536m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
