# Lung3D nginx 站点配置
# 部署：cp lung3d.conf /etc/nginx/conf.d/lung3d.conf && nginx -t && systemctl reload nginx
# 前置：证书放 /etc/nginx/ssl/tdyylung3d.cn.crt 与 .key
# 注意：先删除 Ubuntu 默认站点，避免与 80 端口 default_server 冲突
#       rm -f /etc/nginx/sites-enabled/default

# ---------------- HTTP：仅做跳转 + 证书续期挑战 ----------------
server {
    listen 80;
    listen [::]:80;
    server_name tdyylung3d.cn www.tdyylung3d.cn;

    # Let's Encrypt / acme.sh HTTP 校验放行
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------- HTTPS：TLS 终止 + 反向代理 ----------------
server {
    # nginx < 1.25.1 用此写法；>= 1.25.1 建议改为 `listen 443 ssl;` + `http2 on;`
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tdyylung3d.cn www.tdyylung3d.cn;

    ssl_certificate     /etc/nginx/ssl/tdyylung3d.cn.crt;
    ssl_certificate_key /etc/nginx/ssl/tdyylung3d.cn.key;

    # 微信要求 TLS 1.2 及以上
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 上传大 CT 病例包
    client_max_body_size 500m;
    client_body_timeout 600s;

    # 压缩（GLB 是二进制，收益有限；对 JSON/JS/CSS 有效）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;

    # 静态资源与 GLB 网格缓存（case_id 唯一，缓存安全，缓解 4M 带宽压力）
    location ~* \.(js|css|glb|png|jpe?g|svg|woff2?)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 处理大病例时预留较长超时
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
